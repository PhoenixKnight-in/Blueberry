server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path is a client-side route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at
    # asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
