server {
    listen 80;
    # Alpine's "localhost" often resolves to ::1 before 127.0.0.1, and the
    # image's own HEALTHCHECK curls "http://localhost/" -- without this,
    # nginx only holds the IPv4 socket, so that lookup finds nothing
    # listening on ::1 and the healthcheck (and any IPv6 client) is refused
    # even though the site is genuinely up.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path is a client-side route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at
    # asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
